method: bayes
metric:
  name: val_accuracy
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 3
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.003
  weight_decay:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.1
  dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  rnn_hidden_dim:
    values: [128, 256, 512]
  hidden_dim:
    values: [128, 256, 512]