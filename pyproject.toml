[project]
name = "art"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jaybrandon", email = "jaybrandon@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "gensim>=4.4.0",
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "python-dotenv>=1.2.4",
    "torch>=2.14.1",
]

[project.scripts]
i-ba-nlp-art = "i_ba_nlp_art:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "pre-commit>=4.7.0",
]
