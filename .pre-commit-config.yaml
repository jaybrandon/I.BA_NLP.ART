---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: "Remove trailing whitespaces"
      - id: end-of-file-fixer
        name: "Fix newline at end of files"
      - id: debug-statements
        description: Check for debugger imports and py37+ breakpoint() calls
      - id: mixed-line-ending
        name: "Use linux line endings"
        args: ['--fix=lf']
        description: Force replacement of line ending by the UNIX 'lf' character
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c=.yamllint"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.12
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [python, pyi, jupyter, pyproject]
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi, jupyter]
  - repo: https://github.com/srstevenson/nb-clean
    rev: 4.0.1
    hooks:
      - id: nb-clean
        args:
          - --remove-empty-cells
