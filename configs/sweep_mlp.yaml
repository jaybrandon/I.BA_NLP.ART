method: bayes
metric:
  name: val_accuracy
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 5
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  weight_decay:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.1
  dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  hidden_dim:
    values: [128, 256, 512, 1024, 2048]
  batch_size:
    values: [64, 128, 256]
